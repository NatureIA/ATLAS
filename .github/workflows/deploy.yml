name: Deploy ATLAS to MonsterASP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: atlas-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Validate application
        shell: powershell
        run: |
          node --check server.js
          node --check backend/src/server.js
          node --check public/atlas.js
      - name: Prepare deployment package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          Copy-Item server.js,web.config,package.json,package-lock.json -Destination publish -Force
          New-Item -ItemType Directory -Force -Path publish\backend\src | Out-Null
          Copy-Item backend\src\server.js -Destination publish\backend\src -Force
          Copy-Item public -Destination publish -Recurse -Force
          Copy-Item node_modules -Destination publish -Recurse -Force
      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
