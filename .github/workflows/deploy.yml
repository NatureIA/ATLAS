name: ATLAS - .NET 8 build and MonsterASP deployment
on:
  push:
    branches: [main, atlas-dotnet-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Atlas.csproj
      - name: Compile
        run: dotnet build Atlas.csproj --configuration Release --no-restore
      - name: Publish package
        run: dotnet publish Atlas.csproj --configuration Release --output ./publish --no-restore
      - name: Upload publish output for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: atlas-publish
          path: publish/
          retention-days: 5
      - name: Deploy MonsterASP via WebDeploy
        if: github.ref == 'refs/heads/main'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'