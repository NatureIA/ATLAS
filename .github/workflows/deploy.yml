name: Deploy ATLAS to MonsterASP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: atlas-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Validate source
        run: npm run check
      - name: Prepare deployment
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item server.js,web.config,package.json -Destination publish
          New-Item -ItemType Directory -Force publish\backend\src | Out-Null
          Copy-Item backend\src\* -Destination publish\backend\src -Force
          Copy-Item public -Destination publish -Recurse
          Copy-Item node_modules -Destination publish -Recurse
      - name: Deploy to MonsterASP
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'