name: ATLAS - verificação de pendências a cada 10 minutos
on:
  schedule:
    # Consulta e wake-up do site em intervalos de 10 minutos; envio ocorre apenas nos horarios 08h, 12h, 15h e 18h de Brasilia, ate 4 avisos/dispositivo/dia.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATLAS_PUSH_JOB_KEY: ${{ secrets.ATLAS_PUSH_JOB_KEY }}
    steps:
      - name: Verificar configuracao privada
        run: |
          if [ -z "$ATLAS_PUSH_JOB_KEY" ]; then
            echo "::error::Configure ATLAS_PUSH_JOB_KEY nos Secrets do repositorio e no MonsterASP."
            exit 1
          fi
      - name: Reativar ATLAS e verificar despesas pendentes
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 --retry 2 \
            --request POST \
            --header "X-ATLAS-PUSH-KEY: $ATLAS_PUSH_JOB_KEY" \
            "https://salta-atlas.runasp.net/api/push/dispatch"
