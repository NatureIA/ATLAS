name: Validate ATLAS .NET 8
on:
  push:
    branches: [fix-login-session-2026-10-29]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Atlas.csproj
      - run: dotnet build Atlas.csproj --configuration Release --no-restore
