name: ATLAS - lembretes financeiros nos quatro horarios
on:
  schedule:
    # 08h, 12h, 15h, 18h Brasilia, with retries every 10 minutes within each agreed hour.
    # UTC-3: 11h, 15h, 18h, 21h UTC. No checks in other hours.
    - cron: '3,13,23,33,43,53 11,15,18,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_PUSH_JOB_KEY: ${{ secrets.ATLAS_PUSH_JOB_KEY }}
    steps:
      - name: Verificar configuracao privada
        run: |
          if [ -z "$ATLAS_PUSH_JOB_KEY" ]; then
            echo "::error::Configure ATLAS_PUSH_JOB_KEY nos Secrets do repositorio e no MonsterASP."
            exit 1
          fi
      - name: Disparar notificacoes no servidor sem depender do app aberto
        run: |
          echo "Solicitando envio Web Push no servidor ATLAS."
          curl --fail-with-body --silent --show-error \
            --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --request POST \
            --data '' \
            --header "X-ATLAS-PUSH-KEY: $ATLAS_PUSH_JOB_KEY" \
            "https://salta-atlas.runasp.net/api/push/dispatch"
          echo
          echo "Despacho HTTP concluido; total aceito pelo provedor acima."
